name: update

on:
  schedule:
    # Both possible UTC hours for 08:00, 15:00 and 20:00 Amsterdam time (summer and winter).
    # The guard step decides which trigger is the real one.
    - cron: "0 6,7,13,14,18,19 * * *"
  # The Claude scheduled task pushes homes.json with new Funda and Pararius homes:
  # rebuild the site from it straight away, without visiting Huislijn or Buurtje.
  push:
    branches: [main]
    paths: [homes.json]
  workflow_dispatch:

concurrency:
  group: househunt-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      GEO_CONTACT_EMAIL: ${{ secrets.GEO_CONTACT_EMAIL }}
    steps:
      # Always the newest main, so a run that waited in the queue sees the latest homes.json.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Fetch database from the data branch
        run: |
          mkdir -p data
          if git fetch origin data; then
            git show FETCH_HEAD:househunt.db > data/househunt.db
          fi

      - name: Compile
        run: mvn -B -q compile

      - name: Guard (is this trigger an open slot?)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "command=publish" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "command=run --force" >> "$GITHUB_OUTPUT"
          else
            mvn -B -q exec:java -Dexec.args="guard"
            echo "command=run" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: "22"

      - name: Build the frontend
        if: steps.guard.outputs.run == 'true'
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Collect, filter, encrypt
        if: steps.guard.outputs.run == 'true'
        run: mvn -B -q exec:java -Dexec.args="${{ steps.guard.outputs.command }}"

      # Only the Huislijn and Buurtje entries are ours. If the Claude task pushed meanwhile,
      # its Funda and Pararius entries are taken from main and ours are put next to them.
      - name: Commit the Huislijn and Buurtje homes to homes.json
        if: steps.guard.outputs.run == 'true' && steps.guard.outputs.command != 'publish'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp homes.json /tmp/ours.json
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            git show FETCH_HEAD:homes.json > /tmp/theirs.json 2>/dev/null || echo '[]' > /tmp/theirs.json
            jq -s '[.[0][] | select(.source != "huislijn" and .source != "buurtje")]
                 + [.[1][] | select(.source == "huislijn" or .source == "buurtje")]' \
              /tmp/theirs.json /tmp/ours.json > homes.json
            git add homes.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -q -m "Update Huislijn and Buurtje homes"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "Could not push homes.json after 3 attempts" >&2
          exit 1

      - name: Save the database to the data branch
        if: steps.guard.outputs.run == 'true'
        run: |
          rm -rf /tmp/databranch && mkdir /tmp/databranch && cd /tmp/databranch
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch origin data; then git checkout -q -b data FETCH_HEAD; else git checkout -q --orphan data; fi
          cp "$GITHUB_WORKSPACE/data/househunt.db" househunt.db
          git add househunt.db
          git commit -q -m "Update data" || true
          git push origin data

      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.run == 'true'
        with:
          path: site

      - uses: actions/deploy-pages@v4
        if: steps.guard.outputs.run == 'true'
